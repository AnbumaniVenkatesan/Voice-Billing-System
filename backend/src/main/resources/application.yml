server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/smart_billing
    username: root
    password: root123
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  jackson:
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

jwt:
  secret: YmlsbGluZ3N5c3RlbXNlY3JldGtleWZvcmp3dHRva2VuzmV2ZXJleGhpcmV0b2FsbHlhbmd1bGFy
  expiration: 86400000

paytm:
  merchant-id: YOUR_MERCHANT_ID
  merchant-key: YOUR_MERCHANT_KEY
  merchant-website: YOUR_MERCHANT_WEBSITE
  callback-url: http://localhost:8080/api/paytm/callback

cors:
  allowed-origins: http://localhost:4200

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

app:
  voice-billing:
    core-pool-size: 10
    max-pool-size: 20
    queue-capacity: 100
    thread-name-prefix: VoiceBilling-
