<div class="pw-dialog">
  <div class="pw-icon-circle">
    <mat-icon>password</mat-icon>
  </div>
  <h2 class="pw-title">Reset Password</h2>
  <p class="pw-subtitle">Enter a new password for {{ data.target }}</p>

  <mat-form-field appearance="outline" class="pw-field" [class.pw-field-error]="!!error">
    <mat-label>New password</mat-label>
    <input
      matInput
      type="password"
      [(ngModel)]="password"
      (keyup.enter)="submit()"
      autocomplete="new-password"
      maxlength="50"
    />
  </mat-form-field>

  <p class="pw-error" *ngIf="error">{{ error }}</p>

  <div class="pw-actions">
    <button type="button" class="pw-btn pw-btn-cancel" (click)="cancel()">Cancel</button>
    <button type="button" class="pw-btn pw-btn-primary" (click)="submit()">Reset</button>
  </div>
</div>
