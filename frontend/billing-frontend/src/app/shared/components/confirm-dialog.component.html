<div class="confirm-dialog">
  <div class="confirm-icon-circle">
    <mat-icon>warning_amber</mat-icon>
  </div>
  <h2 class="confirm-title">{{ data.title }}</h2>
  <p class="confirm-message">{{ data.message }}</p>
  <div class="confirm-actions">
    <button type="button" class="confirm-btn confirm-btn-cancel" (click)="cancel()">
      {{ data.cancelLabel || 'Cancel' }}
    </button>
    <button type="button" class="confirm-btn confirm-btn-danger" (click)="confirm()">
      {{ data.confirmLabel || 'Delete' }}
    </button>
  </div>
</div>
